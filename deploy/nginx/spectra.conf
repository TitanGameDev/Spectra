# Reverse proxy + static file server for Spectra in production.
#
# Install: copy to /etc/nginx/sites-available/spectra.conf, symlink into
# sites-enabled, replace app.example.com and the cert paths, then
# `nginx -t && systemctl reload nginx`.
#
# The backend (Kestrel) must be bound to loopback only — set
# ASPNETCORE_URLS=http://127.0.0.1:5080 in its environment — so it is never
# reachable except through this proxy.
#
# Add this once to the `http {}` block of your main /etc/nginx/nginx.conf
# (it can't live inside this server block):
#   limit_req_zone $binary_remote_addr zone=api_zone:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # This is the public edge, so it's the authoritative place for these —
    # the ASP.NET Core app itself only sets a minimal defense-in-depth subset.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /var/www/spectra/frontend;
    index index.html;

    # SPA routing — client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxied to the backend, same origin — this is why VITE_API_BASE_URL
    # should be "" in production (see frontend/.env.example): same-origin
    # calls need no CORS at all.
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
